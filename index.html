<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiExplore · AI 自动探究平台</title>
    <meta name="description" content="HiExplore 是一个面向独立研究者与创作者的 AI 自动探究工具：把一个问题拆成问题树与笔记库，由 AI 团队协助推进。纯前端应用，数据保存在你自己的浏览器本地。">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <!--
      内容安全策略（CSP）
      - script-src 只允许本站脚本，杜绝任何第三方 / 注入脚本执行（不含 unsafe-inline / unsafe-eval）
      - object-src none + base-uri self，防止 <base> 劫持与插件对象
      - connect-src 需保持宽松：本项目支持用户自带模型（BYO-model），
        用户会在设置里填自己的 API 地址，故允许 https/wss 出站
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://cloud.umami.is https://embed.tawk.to https://*.tawk.to;
      style-src 'self' 'unsafe-inline' https://*.tawk.to;
      img-src 'self' data: blob: https:;
      font-src 'self' data: https://*.tawk.to;
      connect-src 'self' blob: https: wss:;
      worker-src 'self' blob:;
      media-src 'self' blob:;
      frame-src 'self' https://*.tawk.to;
      object-src 'none';
      base-uri 'self';
      form-action 'none';
      upgrade-insecure-requests;
    ">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                         'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
        }
        .scroll-hide::-webkit-scrollbar { display: none; }
        #root { height: 100vh; width: 100vw; }
    </style>
    <link rel="stylesheet" href="/index.css">
</head>
<body>
    <!--
      #root 内的静态内容是首屏占位，React 挂载后会被替换。
      这里放主办单位与 ICP 备案号，目的是让**不执行 JavaScript 的抓取程序**
      （搜索引擎、微信安全扫描等）也能在原始 HTML 里直接读到备案信息 ——
      《互联网信息服务备案承诺书》第二条要求主页标明备案编号并链接 beian.miit.gov.cn。
      同样的信息在登录页底部也对真实用户可见（见 App.tsx），二者一致，非隐藏内容。
    -->
    <div id="root">
        <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
            <div style="font-size:15px;color:#94a3b8;">HiExplore · AI 自动探究平台 正在加载…</div>
            <div style="font-size:12px;line-height:2;color:#64748b;text-align:center;">
                <div>深圳市海探科技有限公司</div>
                <a href="https://beian.miit.gov.cn" rel="noopener noreferrer" style="color:#64748b;">粤ICP备2023000583号-1</a>
            </div>
        </div>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
