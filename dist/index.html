    <!-- 自动跳转 HTTPS 脚本：如果不是本地环境且是 http 协议，则跳转 -->
    <script>
        if (window.location.protocol === 'http:' && !window.location.hostname.includes('localhost') && !/^\d+\.\d+\.\d+\.\d+$/.test(window.location.hostname)) {
            window.location.replace(window.location.href.replace('http:', 'https:'));
        }
    </script>
    <!-- 自动将页面上的所有不安全请求升级为安全请求 -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
